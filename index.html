<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会話記録</title>
<meta name="description" content="人と話した内容を記録し、次に会うときに思い出せるようにするための個人用メモアプリ">

<!-- iPhoneでホーム画面に追加した際の見た目・挙動の調整 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="会話記録">
<meta name="theme-color" content="#FAFAF8">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" role="main" aria-live="polite"></div>

<a href="#/record/new" class="fab" aria-label="新しい記録を追加">＋</a>

<nav class="bottom-nav" aria-label="メインナビゲーション">
  <a href="#/" data-match="#/" aria-label="ホーム">
    <span class="bottom-nav__icon" aria-hidden="true">●</span>
    <span class="bottom-nav__label">ホーム</span>
  </a>
  <a href="#/search" data-match="#/search" aria-label="検索">
    <span class="bottom-nav__icon" aria-hidden="true">◎</span>
    <span class="bottom-nav__label">検索</span>
  </a>
  <a href="#/settings" data-match="#/settings" aria-label="設定">
    <span class="bottom-nav__icon" aria-hidden="true">▤</span>
    <span class="bottom-nav__label">設定</span>
  </a>
</nav>

<script type="module" src="js/main.js"></script>
</body>
</html>
